name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run ESLint
      run: npm run lint
      continue-on-error: false
      
    - name: Type check
      run: npx tsc --noEmit
      continue-on-error: false
      
    - name: Run tests
      run: npm test
      continue-on-error: false
      
    - name: Build project
      run: npm run build
      continue-on-error: false
      
    - name: Check build output
      run: |
        if [ ! -d "dist" ]; then
          echo "Build failed: dist directory not found"
          exit 1
        fi
        echo "Build successful - dist directory created"

  seo-check:
    name: SEO Validation
    runs-on: ubuntu-latest
    needs: lint-and-test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Check for missing meta tags
      run: |
        echo "Checking for missing SEO meta tags..."
        missing="$(find src/pages -name "*.tsx" -exec grep -L "Helmet" {} \;)"
        if [ -n "$missing" ]; then
          echo "Warning: pages may be missing Helmet metadata:"
          echo "$missing"
        fi

    - name: Install xmllint
      run: sudo apt-get update && sudo apt-get install -y libxml2-utils

    - name: Validate sitemap.xml
      run: |
        if [ -f "public/sitemap.xml" ]; then
          xmllint --noout public/sitemap.xml
          echo "Sitemap.xml is valid XML"
        else
          echo "Warning: sitemap.xml not found"
        fi
        
    - name: Validate robots.txt
      run: |
        if [ -f "public/robots.txt" ]; then
          echo "robots.txt exists and is accessible"
        else
          echo "Warning: robots.txt not found"
        fi

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint-and-test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run security audit
      run: npm audit --production
      continue-on-error: true
      
    - name: Check for sensitive data
      run: |
        echo "Checking for potential sensitive data..."
        grep -r "password\|secret\|api_key\|token" --include="*.tsx" --include="*.ts" --include="*.js" src/ || true
        echo "Review the output above for any accidental sensitive data"

  build-verification:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: lint-and-test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Production build
      run: npm run build
      
    - name: Verify build output
      run: |
        echo "Build output verification:"
        echo "Total files: $(find dist -type f | wc -l)"
        echo "HTML files: $(find dist -name "*.html" | wc -l)"
        echo "JS files: $(find dist -name "*.js" | wc -l)"
        echo "CSS files: $(find dist -name "*.css" | wc -l)"
        echo "Images: $(find dist -name "*.png" -o -name "*.jpg" -o -name "*.webp" | wc -l)"
        
    - name: Check critical files
      run: |
        critical_files=("index.html" "favicon.ico" "robots.txt" "sitemap.xml")
        for file in "${critical_files[@]}"; do
          if [ -f "dist/$file" ] || [ -f "public/$file" ]; then
            echo "✓ $file exists"
          else
            echo "✗ $file missing"
            exit 1
          fi
        done

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [lint-and-test, seo-check, security-scan, build-verification]
    if: github.event_name == 'pull_request' && github.base_ref == 'develop'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build for staging
      run: npm run build
      env:
        NODE_ENV: staging
        
    # Same reasoning as production: no staging target is wired up, so this
    # must not report success. (Dormant — only runs on PRs based on develop.)
    - name: Staging deployment is NOT automated
      run: |
        echo "::error title=Not deployed::No staging target is configured for this repository."
        exit 1

  production-check:
    name: Production Release Check
    runs-on: ubuntu-latest
    needs: [lint-and-test, seo-check, security-scan, build-verification]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    # This workflow has no route to the production host: deployment is an
    # operator-run Makefile target that rsyncs over SSH and flips a release
    # symlink. Since it cannot publish, it reports instead — it compares the
    # live build marker against this commit. Red means production is behind
    # main; green means an operator has actually deployed it.
    #
    # Before #25 this job echoed and exited 0, so every merge claimed a
    # successful deploy while production served a seven-week-old build. A
    # job that always fails is no better a signal, so this one asks the
    # live site and reports what it finds.
    #
    # No checkout or build is needed: build-verification (a dependency of
    # this job) already builds the tree. This step only reads one URL.
    - name: Compare live build marker with this commit
      run: |
        want="${GITHUB_SHA:0:7}"

        if ! marker="$(curl -fsS --max-time 20 https://velcoretech.com/build.txt)"; then
          echo "::error title=Release check inconclusive::Could not read https://velcoretech.com/build.txt"
          echo "The site did not serve its build marker, so whether production is current is unknown." >&2
          exit 1
        fi

        live="$(printf '%s' "$marker" | awk '{print $3}')"
        echo "live : $marker"
        echo "main : $want"

        if [ "$live" = "$want" ]; then
          echo "Production is serving this commit."
          exit 0
        fi

        echo "::error title=Production is behind main::Live site is on ${live}; main is ${want}. Merging does not deploy."
        cat >&2 <<EOF

        ============================================================
          PRODUCTION IS BEHIND MAIN
        ============================================================
          Live   : ${marker}
          main   : ${want}

          Merging to main builds and verifies. It does NOT publish.

          To release:

              git checkout main && git pull
              make deploy-dry     # review the delta, non-mutating
              make deploy         # rsync + promote + nginx reload

          Verify afterwards:

              curl -s https://velcoretech.com/build.txt
              # must report: ${want}

          Then re-run this job — it goes green once the live marker
          matches. Rollback: make releases && make rollback REL=<id>
        ============================================================

        EOF
        exit 1

  notify-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [lint-and-test, seo-check, security-scan, build-verification]
    if: failure()
    
    steps:
    - name: Send failure notification
      run: |
        echo "Pipeline failed! Check the logs above."
        # Add notification logic here
