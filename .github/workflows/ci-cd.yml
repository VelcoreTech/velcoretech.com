name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run ESLint
      run: npm run lint
      continue-on-error: false
      
    - name: Type check
      run: npx tsc --noEmit
      continue-on-error: false
      
    - name: Run tests
      run: npm test
      continue-on-error: false
      
    - name: Build project
      run: npm run build
      continue-on-error: false
      
    - name: Check build output
      run: |
        if [ ! -d "dist" ]; then
          echo "Build failed: dist directory not found"
          exit 1
        fi
        echo "Build successful - dist directory created"

  seo-check:
    name: SEO Validation
    runs-on: ubuntu-latest
    needs: lint-and-test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Check for missing meta tags
      run: |
        echo "Checking for missing SEO meta tags..."
        find src/pages -name "*.tsx" -exec grep -L "Helmet" {} \;
        if [ $? -eq 0 ]; then
          echo "Warning: Some pages may be missing Helmet metadata"
        fi
        
    - name: Validate sitemap.xml
      run: |
        if [ -f "public/sitemap.xml" ]; then
          xmllint --noout public/sitemap.xml
          echo "Sitemap.xml is valid XML"
        else
          echo "Warning: sitemap.xml not found"
        fi
        
    - name: Validate robots.txt
      run: |
        if [ -f "public/robots.txt" ]; then
          echo "robots.txt exists and is accessible"
        else
          echo "Warning: robots.txt not found"
        fi

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint-and-test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run security audit
      run: npm audit --production
      continue-on-error: true
      
    - name: Check for sensitive data
      run: |
        echo "Checking for potential sensitive data..."
        grep -r "password\|secret\|api_key\|token" --include="*.tsx" --include="*.ts" --include="*.js" src/ || true
        echo "Review the output above for any accidental sensitive data"

  build-verification:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: lint-and-test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Production build
      run: npm run build
      
    - name: Verify build output
      run: |
        echo "Build output verification:"
        echo "Total files: $(find dist -type f | wc -l)"
        echo "HTML files: $(find dist -name "*.html" | wc -l)"
        echo "JS files: $(find dist -name "*.js" | wc -l)"
        echo "CSS files: $(find dist -name "*.css" | wc -l)"
        echo "Images: $(find dist -name "*.png" -o -name "*.jpg" -o -name "*.webp" | wc -l)"
        
    - name: Check critical files
      run: |
        critical_files=("index.html" "favicon.ico" "robots.txt" "sitemap.xml")
        for file in "${critical_files[@]}"; do
          if [ -f "dist/$file" ] || [ -f "public/$file" ]; then
            echo "✓ $file exists"
          else
            echo "✗ $file missing"
            exit 1
          fi
        done

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [lint-and-test, seo-check, security-scan, build-verification]
    if: github.event_name == 'pull_request' && github.base_ref == 'develop'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build for staging
      run: npm run build
      env:
        NODE_ENV: staging
        
    - name: Deploy to staging
      run: |
        echo "Deploying to staging environment..."
        # Add your staging deployment commands here
        # Example: rsync, scp, or deployment script
        
    - name: Staging smoke tests
      run: |
        echo "Running staging smoke tests..."
        # Add your staging tests here

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [lint-and-test, seo-check, security-scan, build-verification]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Create production build
      run: npm run build
      
    - name: Create build marker
      run: |
        BUILD_TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
        BUILD_SHA=${GITHUB_SHA:0:7}
        echo "$BUILD_TS - $BUILD_SHA" > dist/build.txt
        echo "Build marker: $BUILD_TS - $BUILD_SHA"
        
    - name: Deploy to production
      run: |
        echo "Deploying to production..."
        # The actual deployment is handled by the Makefile
        # This step shows the deployment in GitHub Actions
        
    - name: Production smoke tests
      run: |
        echo "Running production smoke tests..."
        # Add production verification tests here
        
    - name: Notify deployment
      if: success()
      run: |
        echo "Production deployment successful!"
        # Add notification logic here (Slack, email, etc.)

  notify-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [lint-and-test, seo-check, security-scan, build-verification]
    if: failure()
    
    steps:
    - name: Send failure notification
      run: |
        echo "Pipeline failed! Check the logs above."
        # Add notification logic here
